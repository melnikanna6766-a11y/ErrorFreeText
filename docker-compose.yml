services:
  server:
    build:
      context: .
    ports:
      - 9090:8080
    depends_on:
      db:
        condition: service_healthy
    environment:
      - SERVER_PORT=8080
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/errorfreetext?currentSchema=public
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
  db:
    image: postgres:18
    restart: always
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=errorfreetext
      - POSTGRES_USER=${DB_USER:-errorfreetext}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-errorfreetext}
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U errorfreetext -d errorfreetext"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  db-data: