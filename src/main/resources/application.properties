spring.application.name=ErrorFreeText
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres?currentSchema=errorfreetext
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
server.port= 9090
spring.liquibase.change-log=db/changelog/changelog-root.xml
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.cache.use_second_level_cache=true
spring.jpa.properties.hibernate.cache.region.factory_class=jcache
spring.jpa.properties.hibernate.javax.cache.provider=org.ehcache.jsr107.EhcacheCachingProvider

fixed.rate=60000
chars.limit=10000000
execution.limit=10000
status.id.created=1
status.id.inProgress=2
status.id.completed=3
status.id.error=4
status.id.incompleted=5

#jdbc:postgresql://db:5432/errorfreetext?currentSchema=public